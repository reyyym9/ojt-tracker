<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e8a">
  <title>Weekly report - OJT Tracker</title>

  <!-- Sets light/dark before the page is drawn (no white flash) -->
  <script src="js/theme-init.js"></script>

  <!-- CSS is split by purpose. Order matters: tokens > themes > base > components > screens -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>

<!--
  THIS PAGE - Weekly report: one paragraph per day, copy/download, photos. Opened from the dashboard. Counts as part of the Report tab.
  Every page has the same 2 parts: the screen content and the menu.
  The menu is repeated in each file; the link for this page has aria-current="page".
  If you add or rename a menu item, update the menu in ALL the pages.
-->
<body>
<div class="app">

  <section class="screen" id="report">
    <header class="screen-header">
      <a class="back-link" href="index.html">&lsaquo; Back</a>
      <div>
        <h1 class="screen-title">Weekly report</h1>
        <p class="screen-subtitle" data-bind="week"></p>
      </div>
    </header>

    <div class="stack">
      <!-- report.js fills this with one paragraph per day -->
      <article class="card">
        <h2 class="card-title">Narrative</h2>
        <div data-bind="paragraphs"></div>
        <p class="card-note" data-bind="generated" hidden></p>
        <p class="card-note" data-bind="missing" hidden></p>
        <div class="button-row">
          <button class="btn btn-primary" type="button" id="copy-btn">Copy report</button>
          <button class="btn" type="button" id="download-btn">Download .txt</button>
          <button class="btn" type="button" id="regen-btn">Regenerate</button>
        </div>
      </article>

      <article class="card" data-bind="photoCard" hidden>
        <h2 class="card-title">Photos</h2>
        <p class="card-note">Tap Save to download a picture for your report.</p>
        <div class="report-photos" data-bind="photos"></div>
      </article>
    </div>
  </section>


  <!-- ============ MENU: bottom bar on phones, left sidebar on tablets/desktops (always visible) ============ -->
  <nav class="tabbar" aria-label="Main menu">
    <p class="tabbar-brand">OJT Tracker</p>
    <a class="tab" href="index.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
      <span class="tab-label">Home</span>
    </a>
    <a class="tab" href="history.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="tab-label">History</span>
    </a>
    <a class="tab" href="reports.html" aria-current="page">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
      <span class="tab-label">Report</span>
    </a>
    <a class="tab" href="settings.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="tab-label">Settings</span>
    </a>
  </nav>

</div>
<script src="js/vendor/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="js/pages/report.js"></script>
</body>
</html>
