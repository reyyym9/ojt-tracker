<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e8a">
  <title>Log today - OJT Tracker</title>

  <!-- Sets light/dark before the page is drawn (no white flash) -->
  <script src="js/theme-init.js"></script>

  <!-- CSS is split by purpose. Order matters: tokens > base > components > screens -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>

<!--
  THIS PAGE - Log today: time in/out, notes, submit. Counts as part of Home.
  Every page has the same 2 parts: the screen content and the menu.
  The menu is repeated in each file; the link for this page has aria-current="page".
  If you add or rename a menu item, update the menu in ALL the pages.
-->
<body>
<div class="app">

  <section class="screen" id="log">
    <header class="screen-header">
      <a class="back-link" href="index.html">&lsaquo; Back</a>
      <div>
        <h1 class="screen-title">Log today</h1>
        <p class="screen-subtitle" data-bind="today"></p>
      </div>
    </header>

    <form class="log-form stack">
      <!-- Choose how the day is logged. The CSS shows/hides the blocks below using :has() -->
      <fieldset class="segmented">
        <legend class="visually-hidden">How do you want to log today?</legend>
        <input type="radio" name="mode" id="mode-split" checked>
        <label for="mode-split">Morning + afternoon</label>
        <input type="radio" name="mode" id="mode-whole">
        <label for="mode-whole">Whole day</label>
      </fieldset>

      <!-- Option A: morning + afternoon -->
      <div class="sessions-split stack">
        <section class="card session">
          <h2 class="session-title">Morning</h2>
          <div class="session-times">
            <div class="time-field">
              <label class="field-label" for="am-in">Time in</label>
              <input class="field" type="time" id="am-in">
              <button class="btn btn-small" type="button" data-now="am-in">Use current time</button>
            </div>
            <div class="time-field">
              <label class="field-label" for="am-out">Time out</label>
              <input class="field" type="time" id="am-out">
              <button class="btn btn-small" type="button" data-now="am-out">Use current time</button>
            </div>
          </div>
        </section>

        <section class="card session">
          <h2 class="session-title">Afternoon</h2>
          <div class="session-times">
            <div class="time-field">
              <label class="field-label" for="pm-in">Time in</label>
              <input class="field" type="time" id="pm-in">
              <button class="btn btn-small" type="button" data-now="pm-in">Use current time</button>
            </div>
            <div class="time-field">
              <label class="field-label" for="pm-out">Time out</label>
              <input class="field" type="time" id="pm-out">
              <button class="btn btn-small" type="button" data-now="pm-out">Use current time</button>
            </div>
          </div>
        </section>
      </div>

      <!-- Option B: whole day -->
      <div class="sessions-whole">
        <section class="card session">
          <h2 class="session-title">Whole day</h2>
          <div class="session-times">
            <div class="time-field">
              <label class="field-label" for="day-in">Time in</label>
              <input class="field" type="time" id="day-in">
              <button class="btn btn-small" type="button" data-now="day-in">Use current time</button>
            </div>
            <div class="time-field">
              <label class="field-label" for="day-out">Time out</label>
              <input class="field" type="time" id="day-out">
              <button class="btn btn-small" type="button" data-now="day-out">Use current time</button>
            </div>
          </div>
        </section>
      </div>

      <!-- Notes: last field of the form -->
      <div class="form-group">
        <label class="field-label" for="notes">What did you do today?</label>
        <textarea class="field" id="notes" rows="4" placeholder="Short notes about your day"></textarea>
      </div>

      <button class="btn btn-primary btn-block" type="submit">Submit</button>

      <!-- Result: hidden until Submit (log.js shows it) -->
      <div class="card result" hidden>
        <p class="result-label">Total hours today</p>
        <p class="result-value" data-bind="total"></p>
      </div>
    </form>
  </section>


  


  <!-- ============ MENU: bottom bar on phones, left sidebar on tablets/desktops (always visible) ============ -->
  <nav class="tabbar" aria-label="Main menu">
    <p class="tabbar-brand">OJT Tracker</p>
    <a class="tab" href="index.html" aria-current="page">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
      <span class="tab-label">Home</span>
    </a>
    <a class="tab" href="history.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="tab-label">History</span>
    </a>
    <a class="tab" href="settings.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="tab-label">Settings</span>
    </a>
  </nav>

</div>
<script type="module" src="js/pages/log.js"></script>
</body>
</html>
