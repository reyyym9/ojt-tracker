<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e8a">
  <title>OJT Tracker</title>

  <!-- CSS is split by purpose. Order matters: tokens > base > components > screens -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>

<!--
  THIS PAGE - Dashboard: progress, weekly chart, floating button to log today.
  Every page has the same 2 parts: the screen content and the menu.
  The menu is repeated in each file; the link for this page has aria-current="page".
  If you add or rename a menu item, update the menu in ALL the pages.
-->
<body>
<div class="app">

  <section class="screen" id="dashboard">
    <header class="screen-header">
      <div>
        <h1 class="screen-title">OJT Tracker</h1>
        <p class="screen-subtitle">Your Company Name</p>
      </div>
    </header>

    <div class="stack stack-grid">
      <!-- Overall progress (the highlighted "hero" card) -->
      <article class="card card-hero">
        <div class="progress-summary">
          <p class="progress-percent">42.5%</p>
          <p class="progress-detail">102h of 240h done</p>
        </div>
        <div class="progress" role="progressbar" aria-label="OJT progress" aria-valuenow="42.5" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 42.5%"></div>
        </div>
        <div class="stat-row">
          <div class="stat"><p class="stat-value">138h 00m</p><p class="stat-label">Hours left</p></div>
          <div class="stat"><p class="stat-value">17</p><p class="stat-label">Est. days left</p></div>
          <div class="stat"><p class="stat-value">12</p><p class="stat-label">Days logged</p></div>
        </div>
      </article>

      <!-- Weekly chart. Each column gets its height from --h (hours / 10 as a percentage). -->
      <article class="card">
        <div class="card-header">
          <h2 class="card-title">This week</h2>
          <div class="week-nav">
            <a class="btn-icon" href="index.html" aria-label="Previous week">&lsaquo;</a>
            <span class="week-label">Nov 2 - Nov 8</span>
            <a class="btn-icon" href="index.html" aria-label="Next week">&rsaquo;</a>
          </div>
        </div>

        <div class="chart" role="img" aria-label="Hours worked each day this week">
          <div class="chart-plot">
            <div class="chart-target" style="--target: 80%"></div> <!-- dashed line = daily target (8h) -->
            <div class="chart-col" style="--h: 80%"><span class="chart-value">8.0</span><div class="chart-bar"></div></div>
            <div class="chart-col" style="--h: 85%"><span class="chart-value">8.5</span><div class="chart-bar"></div></div>
            <div class="chart-col" style="--h: 0%"><div class="chart-bar"></div></div>
            <div class="chart-col" style="--h: 95%"><span class="chart-value">9.5</span><div class="chart-bar chart-bar-over"></div></div>
            <div class="chart-col" style="--h: 40%"><span class="chart-value">4.0</span><div class="chart-bar"></div></div>
            <div class="chart-col" style="--h: 0%"><div class="chart-bar"></div></div>
            <div class="chart-col" style="--h: 0%"><div class="chart-bar"></div></div>
          </div>
          <div class="chart-axis">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
        </div>
        <p class="card-note">Dashed line = daily target. Amber = overtime.</p>
      </article>
    </div>

    <!-- Floating button: opens the log screen -->
    <a class="fab" href="log.html">+ Log today</a>
  </section>


  


  <!-- ============ MENU: bottom bar on phones, left sidebar on tablets/desktops (always visible) ============ -->
  <nav class="tabbar" aria-label="Main menu">
    <p class="tabbar-brand">OJT Tracker</p>
    <a class="tab" href="index.html" aria-current="page">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
      <span class="tab-label">Home</span>
    </a>
    <a class="tab" href="history.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="tab-label">History</span>
    </a>
    <a class="tab" href="settings.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="tab-label">Settings</span>
    </a>
  </nav>

</div>
</body>
</html>
