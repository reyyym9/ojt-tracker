<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e8a">
  <title>OJT Tracker</title>

  <!-- Sets light/dark before the page is drawn (no white flash) -->
  <script src="js/theme-init.js"></script>

  <!-- CSS is split by purpose. Order matters: tokens > themes > base > components > screens -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>

<!--
  THIS PAGE - Dashboard: progress, weekly chart, floating button to log today.
  Every page has the same 2 parts: the screen content and the menu.
  The menu is repeated in each file; the link for this page has aria-current="page".
  If you add or rename a menu item, update the menu in ALL the pages.
-->
<body>
<div class="app">

  <section class="screen" id="dashboard">
    <header class="screen-header">
      <div>
        <h1 class="screen-title">OJT Tracker</h1>
        <p class="screen-subtitle" data-bind="company">Your Company Name</p>
      </div>
      <p class="week-badge screen-header-action" data-bind="weekBadge"></p>
    </header>

    <div class="stack stack-grid">
      <!-- Overall progress (the highlighted "hero" card) -->
      <article class="card card-hero">
        <div class="progress-summary">
          <p class="progress-percent" data-bind="percent">0%</p>
          <p class="progress-detail" data-bind="detail"></p>
        </div>
        <div class="progress" role="progressbar" aria-label="OJT progress" aria-valuenow="42.5" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" style="width: 0%" data-bind="bar"></div>
        </div>
        <div class="stat-row">
          <div class="stat"><p class="stat-value" data-bind="left"></p><p class="stat-label">Hours left</p></div>
          <div class="stat"><p class="stat-value" data-bind="daysLeft"></p><p class="stat-label">Est. days left</p></div>
          <div class="stat"><p class="stat-value" data-bind="daysLogged"></p><p class="stat-label">Days logged</p></div>
        </div>
        <p class="card-note" data-bind="finish"></p>
      </article>

      <!-- Weekly chart. dashboard.js draws the bars; each column gets its height from --h. -->
      <article class="card">
        <div class="card-header">
          <h2 class="card-title" data-bind="weekTitle">This week</h2>
          <div class="week-nav">
            <button class="btn-icon" type="button" data-week="-1" aria-label="Previous week">&lsaquo;</button>
            <span class="week-label" data-bind="weekLabel"></span>
            <button class="btn-icon" type="button" data-week="1" aria-label="Next week">&rsaquo;</button>
          </div>
        </div>

        <div class="chart" role="img" aria-label="Hours worked each day this week">
          <div class="chart-plot">
            <div class="chart-target" style="--target: 80%"></div> <!-- dashed line = daily target (8h) -->
          </div>
          <div class="chart-axis">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
        </div>
        <p class="card-note">Dashed line = daily target. Amber = overtime.</p>
      </article>

      <!-- Tasks and photos of the week shown in the chart. dashboard.js fills it in. -->
      <article class="card card-wide">
        <h2 class="card-title" data-bind="workTitle">Tasks and photos</h2>
        <div data-bind="tasks"></div>
        <div class="photo-grid" data-bind="weekPhotos"></div>
        <button class="btn btn-primary btn-block" type="button" id="report-btn">Generate weekly report</button>
        <p class="card-note" data-bind="reportNote"></p>
      </article>
    </div>

    <!-- Floating button: opens the log screen -->
    <a class="fab" href="log.html">+ Log today</a>
  </section>


  


  <!-- ============ MENU: bottom bar on phones, left sidebar on tablets/desktops (always visible) ============ -->
  <nav class="tabbar" aria-label="Main menu">
    <p class="tabbar-brand">OJT Tracker</p>
    <a class="tab" href="index.html" aria-current="page">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
      <span class="tab-label">Home</span>
    </a>
    <a class="tab" href="history.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="tab-label">History</span>
    </a>
    <a class="tab" href="reports.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
      <span class="tab-label">Report</span>
    </a>
    <a class="tab" href="settings.html">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="tab-label">Settings</span>
    </a>
  </nav>

</div>
<script src="js/vendor/supabase.js"></script>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
